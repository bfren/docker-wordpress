name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: wordpress
      folders: |
        php8.2
        php8.3
        php8.4
        php8.5
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        ${FOLDER}
        ${FOLDER}-${VERSION_MAJOR}
        ${FOLDER}-${VERSION_MINOR}
        ${FOLDER}-${VERSION}
        ${FOLDER}-wp${WP_MINOR}
        ${FOLDER}-wp${WP_MINOR}-${VERSION}
        ${FOLDER}-wp${WP_VERSION}
        ${FOLDER}-wp${WP_VERSION}-${VERSION}
        php${PHP_REVISION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
